server:
  port: 8080
  shutdown: graceful                            # Finish in-flight requests before stopping

spring:
  profiles:
    active: dev
  application:
    name: CCM-APIGateway
  main:
    lazy-initialization: false
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: false
      httpclient:
        pool:
          max-idle-time: 20s         # Drop idle connections before the service's keep-alive closes them
    loadbalancer:
      cache:
        ttl: 5s
        enabled: true

# Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true             # Breaker state appears in /actuator/health
        slidingWindowSize: 10                     # Look at the last 10 calls when calculating failure rate
        minimumNumberOfCalls: 10                  # Don't evaluate (or open) until at least 10 calls are recorded
        failureRateThreshold: 50                  # Circuit opens if 5 or more of those 10 calls fail
        waitDurationInOpenState: 10s              # Stays open for 10s, then goes to HALF_OPEN
        permittedNumberOfCallsInHalfOpenState: 3  # 3 trial calls decide whether it closes or reopens
    instances:
      securityCB: { baseConfig: default }
      clientCB: { baseConfig: default }
      customerCB: { baseConfig: default }
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s                      # Any call longer than 10s counts as a failure
    instances:
      securityCB: { baseConfig: default }
      clientCB: { baseConfig: default }
      customerCB: { baseConfig: default }

# Eureka Client Configuration
eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
    hostname: localhost
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL}

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      circuitbreakers:
        enabled: true
      show-details: always
    gateway:
      enabled: true

# Logging Pattern
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.ccm.gateway: INFO
    com.netflix.discovery: INFO
log:
  path: ../logs