server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: CCM-APIGateway
  main:
    lazy-initialization: false
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: false
    loadbalancer:
      cache:
        ttl: 5s
        enabled: true

# Eureka Client Configuration
eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
    hostname: localhost
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL}

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# Logging Pattern
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.ccm.gateway: INFO
    com.netflix.discovery: INFO
log:
  path: ../logs